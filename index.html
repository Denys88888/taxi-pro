    <script>
      // Prevent FOUC - set theme before React loads
      (function() {
        var theme = localStorage.getItem('taxipro_theme') || 'system';
        var resolved = theme;
        if (theme === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>

  <body>
    <div id="root">
      <div id="loading" style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:sans-serif;z-index:99999;">
        <div>Loading Taxi Pro...</div>
      </div>
    </div>
    <script>
      // GPS Geolocation — save real location for app to use
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: 'Мое местоположение', address: 'Текущее местоположение' };
            localStorage.setItem('taxipro_gps_pickup', JSON.stringify(loc));
            console.log('[GPS] Location saved:', loc);
          },
          () => { console.log('[GPS] Permission denied, using default'); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      }
    </script>

    <!-- Clear old service workers and cache -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
        }
        // Hide loading fallback when React loads
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var el = document.getElementById('loading');
            if (el) el.style.display = 'none';
          }, 3000);
        });
      })();
    </script>
  </body>
