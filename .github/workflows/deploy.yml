name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The app moved to https://denys88888.github.io/ (repo denys88888.github.io).
# This Pages site now only publishes a redirect stub so the old
# /taxi-pro/ URL keeps working.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>Taxi Pro</title>
              <script>window.location.replace('https://denys88888.github.io/');</script>
              <meta http-equiv="refresh" content="0;url=https://denys88888.github.io/" />
            </head>
            <body>Moved to <a href="https://denys88888.github.io/">denys88888.github.io</a></body>
          </html>
          HTML
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
